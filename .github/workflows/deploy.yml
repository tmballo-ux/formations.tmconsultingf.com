name: Déployer sur le VPS

# Se déclenche à chaque push sur la branche principale
on:
  push:
    branches: [main]
    # Si votre branche principale s'appelle "master", remplacez ci-dessus par: branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Copier les fichiers vers le VPS (rsync via SSH)
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: ./
          remote_path: /var/www/formations.tmconsultingf.com/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
          # Exclure les fichiers qui n'ont rien à faire sur le serveur
          exclude: >-
            .git/
            .github/
            README.md
            netlify.toml
            nginx-formations.conf
